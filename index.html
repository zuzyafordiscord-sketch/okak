<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Geometry Dash</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Mini Geometry Dash</h1>
      <p class="hint">Нажми <strong>Пробел</strong>, <strong>↑</strong> или <strong>ЛКМ</strong>, чтобы прыгать.</p>
      <canvas id="game" width="960" height="320" aria-label="Игровое поле"></canvas>
      <div class="hud">
        <span>Счёт: <b id="score">0</b></span>
        <span>Рекорд: <b id="best">0</b></span>
      </div>
      <button id="restart" hidden>Играть снова</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
